<!doctype html><html><head><meta charset="utf-8"><title>CM1 Host message acceptance fixture</title><style>body{font:16px system-ui}button{padding:14px}iframe{width:48%;height:600px;border:1px solid #ccc}</style></head><body><h1>CM1 Host-message acceptance fixture</h1><p>This maintenance-only page sends the documented protocol-1 messages to actual monitor and performer pages; it does not emulate native embedding.</p><button id="messages">Send sand theme and Chinese locale</button><button id="reset">Send original theme and English locale</button><div><iframe id="monitor" title="CM1 monitor" src="http://127.0.0.1:6969/"></iframe><iframe id="performer" title="CM1 performer" src="http://127.0.0.1:6968/"></iframe></div><script>
function send(theme,locale,palette){for(const id of ['monitor','performer']){const target=document.getElementById(id).contentWindow;target.postMessage({type:'pnds:theme',version:1,theme,palette},'*');target.postMessage({type:'pnds:locale',version:1,locale},'*');}}
document.getElementById('messages').onclick=()=>send('sand','zh-CN',{bg:'#e5ded2',text:'#504b42'});
document.getElementById('reset').onclick=()=>send('stage','en',{bg:'#101d21',text:'#d0e2c1'});
</script></body></html>
